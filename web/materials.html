<!DOCTYPE html>
<html lang="zh-CN" data-build="yanxu-v13-clarity-r8">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7ff">
  <meta name="description" content="研序培训资料中心｜无需登录即可下载已上架的学习包与培训资料">
  <title>培训资料中心 · 研序</title>
  <link rel="icon" href="/assets/yx-mark-v13.png?v=20260906v13" type="image/png">
  <link rel="stylesheet" href="/materials.css?v=20260822v11r3b">
  <link rel="stylesheet" href="/v13.css?v=20260906v13r8">
</head>
<body class="yx-v13 materials-page">
  <header class="material-topbar">
    <a class="material-brand" href="/" aria-label="返回研序首页">
      <img src="/assets/yx-mark-v13.png?v=20260906v13" alt="">
      <span><b>研序</b><small>资料中心</small></span>
    </a>
    <div class="material-top-actions">
      <a class="material-history-link" href="/updates.html">往期更新</a>
      <a class="system-link" href="/">进入研序 <i data-lucide="arrow-up-right" aria-hidden="true"></i></a>
    </div>
  </header>

  <main class="material-main">
    <section class="material-hero" aria-labelledby="material-title">
      <div class="material-hero-copy">
        <span class="material-kicker">LEARNING RESOURCES</span>
        <h1 id="material-title">培训资料中心</h1>
        <p>课程讲义、实用工具与专题学习包。</p>
      </div>
      <div class="material-stats" aria-label="资料中心概况">
        <span><b id="material-count">—</b><small>份公开资料</small></span>
        <span><b id="category-count">—</b><small>个分类</small></span>
      </div>
    </section>
    <div class="material-workspace">
    <aside class="material-directory" aria-label="资料分类">
      <h2>浏览资料</h2>
      <div class="material-categories" id="material-categories" role="group" aria-label="按资料分类筛选"></div>
      <div class="material-access-note"><i data-lucide="download" aria-hidden="true"></i><b>无需账号，直接下载</b><p>仅展示已上架资料。文件保留原始格式，下载后即可使用。</p></div>
    </aside>
    <section class="material-library" aria-labelledby="library-heading">
      <div class="library-heading">
        <div><h2 id="library-heading">全部资料</h2></div>
        <div class="admin-actions" id="admin-actions" hidden>
          <button type="button" id="add-material"><i data-lucide="plus" aria-hidden="true"></i>上传资料</button>
        </div>
      </div>
      <section class="material-controls" aria-label="资料筛选">
      <label class="material-search" for="material-search">
        <i data-lucide="search" aria-hidden="true"></i>
        <input id="material-search" type="search" placeholder="搜索资料名称、分类或简介" aria-label="搜索资料名称、分类或简介" autocomplete="off">
        <kbd>/</kbd>
      </label>
        <p id="library-summary" role="status" aria-live="polite">正在同步资料…</p>
      </section>
      <div class="material-grid" id="material-grid" aria-busy="true">
        <div class="material-skeleton"></div><div class="material-skeleton"></div><div class="material-skeleton"></div>
      </div>
    </section>
    </div>
  </main>

  <footer class="material-footer">
    <span>研序 · 培训运营中心</span>
    <span>仅公开学习资料 · 讲师简历不对外开放</span>
  </footer>

  <div class="material-toast" id="material-toast" role="status" aria-live="polite" hidden></div>
  <div id="material-modal-root"></div>
  <script src="/lucide.min.js?v=20260906v13"></script>
  <script src="/materials.js?v=20260906v13r7"></script>
</body>
</html>
